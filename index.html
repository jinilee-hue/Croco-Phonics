<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#cfe7ee">
<title>Croco Phonics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%90%8A%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/font.css">
<link rel="stylesheet" href="css/font-ko.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" data-screen="title" data-turn="0">
  <!-- playroom backdrop (the user's croco_bg.png → assets/img/bg.webp) + floating sparkles -->
  <div class="room" aria-hidden="true">
    <i class="mote" style="--x:31%;--y:13%;--c:#ff9fc4;--d:0s"></i><i class="mote" style="--x:63%;--y:11%;--c:#b3a2ff;--d:-1.2s"></i>
    <i class="mote" style="--x:73%;--y:24%;--c:#ff9fc4;--d:-2.4s"></i><i class="mote" style="--x:24%;--y:29%;--c:#8fe0b6;--d:-.6s"></i>
    <i class="mote" style="--x:69%;--y:35%;--c:#ffc36b;--d:-3.1s"></i><i class="mote" style="--x:38%;--y:40%;--c:#8fd6ff;--d:-1.7s"></i>
    <i class="mote" style="--x:58%;--y:31%;--c:#8fe0b6;--d:-2.9s"></i><i class="mote" style="--x:27%;--y:46%;--c:#b3a2ff;--d:-.9s"></i>
  </div>

  <canvas id="croc" aria-label="Crocodile — tap a tooth"></canvas>

  <!-- floating clay letters + picture cards (decor) -->
  <div class="deco" aria-hidden="true">
    <b class="l3d" style="--x:8%;--y:24%;--c:#ff7fb0;--r:-12deg;--d:0s">m</b>
    <b class="l3d low" style="--x:4.5%;--y:74%;--c:#58b8f2;--r:10deg;--d:-1.3s">m</b>
    <b class="l3d big low" style="--x:22%;--y:74%;--c:#ff8a4c;--r:-8deg;--d:-2.2s">M</b>
    <b class="l3d" style="--x:91%;--y:24%;--c:#5fd0a4;--r:14deg;--d:-.7s">m</b>
    <b class="l3d big low" style="--x:94%;--y:73%;--c:#ff7fb0;--r:-10deg;--d:-1.9s">M</b>
    <b class="l3d low" style="--x:78%;--y:74%;--c:#ffc847;--r:8deg;--d:-2.8s">m</b>
    <div class="fly fly-l" data-word="monkey"></div>
    <div class="fly fly-r" data-word="map"></div>
    <div class="lay lay-l" data-word="mouse"></div>
    <div class="lay lay-r" data-word="moon"></div>
  </div>

  <!-- title -->
  <section class="title">
    <img class="logo" src="assets/img/logo.webp" alt="Croco Phonics" draggable="false">
    <button id="start" class="start" aria-label="START">START<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15a1 1 0 0 0 1.5.87l12-7.5a1 1 0 0 0 0-1.74l-12-7.5A1 1 0 0 0 7 4.5z"/></svg></button>
  </section>

  <!-- game HUD -->
  <section class="hud">
    <img class="glogo" src="assets/img/logo.webp" alt="" draggable="false">
    <div class="lvtag" id="lvTag" aria-live="polite"><span class="n">Level 1</span><span class="s">Mm</span></div>
    <div class="lvup" id="lvUp" aria-live="polite"><div class="lv-rb"><span class="t">Level 1!</span></div><div class="lv-ltr"><b>Mm</b></div><div class="lv-sub"></div></div>
    <div class="player p1" data-p="0">
      <div class="ava"><img src="assets/img/p1.webp" alt="" draggable="false"></div>
      <div class="name" data-i18n="p1">Player 1</div>
      <div class="stack" aria-label="Player 1 cards"></div>
    </div>
    <div class="player p2" data-p="1">
      <div class="ava"><img src="assets/img/p2.webp" alt="" draggable="false"></div>
      <div class="name" data-i18n="p2">Player 2</div>
      <div class="stack" aria-label="Player 2 cards"></div>
    </div>
    <div class="target" id="target" aria-live="polite"></div>
    <div class="turn" id="turn"><span class="t">Player 1's Turn!</span><span class="hand-ico" aria-hidden="true"></span></div>
    <div class="hint" id="hint" aria-hidden="true"><img src="assets/img/hand.webp" alt="" draggable="false"></div>
    <div class="bubble" id="bubble" aria-live="polite"><p></p></div>
    <div class="mic" id="mic" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0" fill="none" stroke="#ff7d2e" stroke-width="2.2" stroke-linecap="round"/><path d="M12 17.5V21" stroke="#ff7d2e" stroke-width="2.2" stroke-linecap="round"/></svg></div>
  </section>
  <button id="skip" class="skip" aria-label="Skip the explanation" data-i18n-aria="a_skip"><span data-i18n="skip">Skip</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 6l6 6-6 6M12.5 6l6 6-6 6"/></svg></button>
  <div class="cards" id="cards"></div>

  <!-- result -->
  <section class="result" id="result" aria-live="polite">
    <div class="ribbon"><span id="rbText">Player 1 Wins!</span></div>
    <div class="podium">
      <div class="champ"><div class="crown" aria-hidden="true"></div><div class="ava"><img id="champImg" src="assets/img/p1.webp" alt=""></div></div>
    </div>
    <div class="r-btns">
      <button id="next" class="start again next"><span data-i18n="next">Next Level</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h13.5M12.5 5.5 19 12l-6.5 6.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="again" class="start again"><span data-i18n="again">Play Again</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 1 0 7.75 10h-2.1A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35A7.96 7.96 0 0 0 12 4z"/></svg></button>
    </div>
  </section>

  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="sys">
    <button id="btnLang" class="lang-tog" data-l="en" aria-label="Language: English or Korean" data-i18n-aria="a_lang" aria-pressed="false">
        <span class="knob"></span>
        <span class="flag on" data-l="en"><svg viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="flag-en"><circle cx="12" cy="12" r="12"/></clipPath></defs><g clip-path="url(#flag-en)"><rect width="24" height="24" fill="#fff"/><rect y="0" width="24" height="1.85" fill="#b22234"/><rect y="3.69" width="24" height="1.85" fill="#b22234"/><rect y="7.38" width="24" height="1.85" fill="#b22234"/><rect y="11.08" width="24" height="1.85" fill="#b22234"/><rect y="14.77" width="24" height="1.85" fill="#b22234"/><rect y="18.46" width="24" height="1.85" fill="#b22234"/><rect y="22.15" width="24" height="1.85" fill="#b22234"/><rect width="12" height="12.92" fill="#3c3b6e"/><g fill="#fff"><circle cx="1.6" cy="1.8" r=".7"/><circle cx="4.5" cy="1.8" r=".7"/><circle cx="7.4" cy="1.8" r=".7"/><circle cx="10.3" cy="1.8" r=".7"/><circle cx="3.05" cy="3.7" r=".7"/><circle cx="5.95" cy="3.7" r=".7"/><circle cx="8.85" cy="3.7" r=".7"/><circle cx="1.6" cy="5.6" r=".7"/><circle cx="4.5" cy="5.6" r=".7"/><circle cx="7.4" cy="5.6" r=".7"/><circle cx="10.3" cy="5.6" r=".7"/><circle cx="3.05" cy="7.5" r=".7"/><circle cx="5.95" cy="7.5" r=".7"/><circle cx="8.85" cy="7.5" r=".7"/><circle cx="1.6" cy="9.4" r=".7"/><circle cx="4.5" cy="9.4" r=".7"/><circle cx="7.4" cy="9.4" r=".7"/><circle cx="10.3" cy="9.4" r=".7"/><circle cx="3.05" cy="11.3" r=".7"/><circle cx="5.95" cy="11.3" r=".7"/><circle cx="8.85" cy="11.3" r=".7"/></g></g></svg></span>
        <span class="flag" data-l="ko"><svg viewBox="-12 -12 24 24" aria-hidden="true"><defs><clipPath id="flag-ko"><circle r="12"/></clipPath></defs><g clip-path="url(#flag-ko)"><rect x="-18" y="-12" width="36" height="24" fill="#fff"/><g transform="rotate(33.69)"><path d="M-6 0a6 6 0 0 1 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#cd2e3a"/><path d="M-6 0a6 6 0 0 0 12 0 3 3 0 0 0-6 0 3 3 0 0 1-6 0z" fill="#0047a0"/></g><g fill="#151515"><g transform="rotate(33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="5.6"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g><g transform="rotate(33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="2.5"/><rect x="-.75" y=".3" width=".9" height="2.5"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(10.2 0)"><rect x="-2.2" y="-2.8" width=".9" height="2.5"/><rect x="-2.2" y=".3" width=".9" height="2.5"/><rect x="-.75" y="-2.8" width=".9" height="5.6"/><rect x=".7" y="-2.8" width=".9" height="2.5"/><rect x=".7" y=".3" width=".9" height="2.5"/></g><g transform="rotate(-33.69) translate(-10.2 0)"><rect x="-1.55" y="-2.8" width=".9" height="5.6"/><rect x="-.15" y="-2.8" width=".9" height="2.5"/><rect x="-.15" y=".3" width=".9" height="2.5"/><rect x="1.25" y="-2.8" width=".9" height="5.6"/></g></g></g></svg></span>
      </button>
    <button id="btnSound" class="sysbtn" aria-label="Sound on/off" data-i18n-aria="a_sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5v5a1 1 0 0 0 1 1h3l4.3 3.6a.8.8 0 0 0 1.3-.6V5.5a.8.8 0 0 0-1.3-.6L8 8.5H5a1 1 0 0 0-1 1z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M18.8 6a8.5 8.5 0 0 1 0 12"/><path class="x" d="M16.5 9.5l5 5m0-5l-5 5"/></svg></button>
    <button id="btnHome" class="sysbtn" aria-label="Home" data-i18n-aria="a_home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.2 12 4l8.5 7.2M6 9.5V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1V9.5"/></svg></button>
  </div>
  <div class="loading" id="loading"><i></i></div>
</div>

<script src="js/words.js"></script>
<script src="js/voice.js"></script>
<script src="js/voice-data.js"></script>
<script src="js/bgm-data.js"></script>
<script src="vendor/three.iife.js"></script>
<script src="js/sdf.js"></script>
<script src="js/croc.js"></script>
<script src="js/stage.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
</body>
</html>
